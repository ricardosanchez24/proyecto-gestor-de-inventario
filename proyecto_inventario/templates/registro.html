<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Gestor de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">
    <h2 class="text-center mb-4">📝 Registrarse</h2>
    
    <div id="alerta" class="alert d-none" role="alert"></div>

    <form id="registroForm">
        <div class="mb-3">
            <label for="email" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" required>
        </div>
        <div class="mb-3">
            <label for="rol" class="form-label">Rol</label>
            <select class="form-select" id="rol">
                <option value="ADMIN">Administrador</option>
                <option value="USER">Usuario</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success w-100">Crear Cuenta</button>
    </form>
    
    <div class="mt-3 text-center">
        <a href="/ingresar">¿Ya tienes cuenta? Inicia sesión</a>
    </div>
</div>

<script>
    document.getElementById('registroForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const datos = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            rol: document.getElementById('rol').value
        };

        const alerta = document.getElementById('alerta');

        try {
            const respuesta = await fetch('/registro', { // Endpoint de tu backend
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });

            const data = await respuesta.json();

            if (respuesta.ok) {
                alerta.className = 'alert alert-success';
                alerta.textContent = '¡Usuario creado! Redirigiendo al login...';
                alerta.classList.remove('d-none');
                setTimeout(() => window.location.href = '/ingresar', 2000);
            } else {
                alerta.className = 'alert alert-danger';
                alerta.textContent = data.Error || "Error al registrar";
                alerta.classList.remove('d-none');
            }
        } catch (error) {
            alerta.className = 'alert alert-danger';
            alerta.textContent = "Error de conexión";
            alerta.classList.remove('d-none');
        }
    });
</script>

</body>
</html>
