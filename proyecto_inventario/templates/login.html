<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Gestor de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px;">
    <h2 class="text-center mb-4">🔐 Iniciar Sesión</h2>
    
    <div id="alertaError" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm">
        <div class="mb-3">
            <label for="email" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
    
    <div class="mt-3 text-center">
        <a href="/registrarse">¿No tienes cuenta? Regístrate aquí</a>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const alerta = document.getElementById('alertaError');

        try {
            const respuesta = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await respuesta.json();

            if (respuesta.ok) {
                // GUARDAR EL TOKEN EN EL NAVEGADOR
                localStorage.setItem('token', data.token);
                // Redirigir al inicio (donde está el inventario)
                window.location.href = '/'; 
            } else {
                alerta.textContent = data.Error || "Credenciales inválidas"; // Mostrar error del backend
                alerta.classList.remove('d-none');
            }
        } catch (error) {
            alerta.textContent = "Error de conexión con el servidor";
            alerta.classList.remove('d-none');
        }
    });
</script>

</body>
</html>
