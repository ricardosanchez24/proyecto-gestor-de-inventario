<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">📦 Inventario Pro</a>
        <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>
</nav>

<div class="container">
    <h2 class="text-center mb-4">Panel de Control</h2>

    <div class="card p-4 mb-4 shadow-sm">
        <h4>Nuevo Producto</h4>
        <form id="productoForm">
            <div class="row">
                <div class="col-md-4 mb-2">
                    <input type="text" id="nombre" class="form-control" placeholder="Nombre del producto" required>
                </div>
                <div class="col-md-2 mb-2">
                    <input type="number" id="stock" class="form-control" placeholder="Stock" required>
                </div>
                <div class="col-md-2 mb-2">
                    <input type="number" id="precio" class="form-control" placeholder="Precio" step="0.01" required>
                </div>
                <div class="col-md-4 mb-2">
                    <input type="text" id="descripcion" class="form-control" placeholder="Descripción">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Agregar Producto</button>
        </form>
    </div>

    <div class="card p-4 shadow-sm">
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Producto</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                    <th class="text-center">Stock</th> <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaProductos">
                </tbody>
        </table>
    </div>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<div id="reader" style="width: 100%; max-width: 500px;"></div>

<p>Resultado: <span id="result" style="font-weight: bold; color: green;">Esperando código...</span></p>

<script>

    function onScanSuccess(decodedText, decodedResult) {
    // Lo que sucede cuando se detecta un código
    document.getElementById('result').innerText = decodedText;
    console.log(`Código escaneado: ${decodedText}`, decodedResult);
    
    // Opcional: Detener el escáner tras el primer éxito
    // html5QrcodeScanner.clear();
}

    function onScanFailure(error) {
    // Errores de lectura (suceden constantemente mientras busca, se pueden ignorar)
}

    let html5QrcodeScanner = new Html5QrcodeScanner(
    "reader", 
    { 
        fps: 10,       // Velocidad de escaneo (cuadros por segundo)
        qrbox: { width: 250, height: 150 } // Área de enfoque (ajustada para barras y QR)
    }, 
    /* verbose= */ false
);

    html5QrcodeScanner.render(onScanSuccess, onScanFailure);

    const API_URL = '/productos';
    const token = localStorage.getItem('token');

    // 🔒 PROTECCIÓN: Si no hay token, mandar al login
    if (!token) {
        window.location.href = '/ingresar';
    }

    // Función para Cerrar Sesión
    function cerrarSesion() {
        localStorage.removeItem('token');
        window.location.href = '/ingresar';
    }

    // --- CARGAR PRODUCTOS ---
    async function cargarProductos() {
        const respuesta = await fetch(API_URL, {
            method: 'GET',
            headers: { 'x-access-token': token }
        });

        if (respuesta.status === 401) {
            alert("Tu sesión ha expirado");
            cerrarSesion();
            return;
        }

        const productos = await respuesta.json();
        const tabla = document.getElementById('tablaProductos');
        tabla.innerHTML = ''; 

        productos.forEach(prod => {
            tabla.innerHTML += `
                <tr>
                    <td>${prod.id_producto}</td>
                    <td><strong>${prod.nombre_producto}</strong></td>
                    <td>${prod.descripcion}</td>
                    <td>$${prod.precio}</td>
                    
                    <td class="text-center">
                        <div class="btn-group" role="group">
                            <button class="btn btn-outline-danger btn-sm" onclick="cambiarStock(${prod.id_producto}, -1)">
                                <i class="bi bi-dash-lg"></i>
                            </button>
                            <span class="btn btn-light disabled" style="width: 50px; color: black; font-weight: bold;">
                                ${prod.stock}
                            </span>
                            <button class="btn btn-outline-success btn-sm" onclick="cambiarStock(${prod.id_producto}, 1)">
                                <i class="bi bi-plus-lg"></i>
                            </button>
                        </div>
                    </td>

                    <td>
                        <button class="btn btn-danger btn-sm" onclick="eliminarProducto(${prod.id_producto})">
                            <i class="bi bi-trash"></i> Eliminar
                        </button>
                    </td>
                </tr>
            `;
        });
    }

    // --- NUEVA FUNCIÓN: CAMBIAR STOCK (+1 o -1) ---
    async function cambiarStock(id, cantidad) {
        try {
            const respuesta = await fetch(`${API_URL}/${id}/stock`, {
                method: 'PATCH',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-access-token': token
                },
                body: JSON.stringify({ cantidad: cantidad })
            });

            const data = await respuesta.json();

            if (respuesta.ok) {
                cargarProductos(); // Recargar la tabla para ver el cambio
            } else {
                alert(data.error || "Error al actualizar stock");
            }
        } catch (error) {
            console.error("Error:", error);
        }
    }

    // --- CREAR PRODUCTO ---
    document.getElementById('productoForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const nuevoProducto = {
            nombre_producto: document.getElementById('nombre').value,
            stock: parseInt(document.getElementById('stock').value),
            precio: parseFloat(document.getElementById('precio').value),
            descripcion: document.getElementById('descripcion').value
        };

        const respuesta = await fetch(API_URL, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'x-access-token': token 
            },
            body: JSON.stringify(nuevoProducto)
        });

        if(respuesta.ok){
            document.getElementById('productoForm').reset();
            cargarProductos();
        } else {
            alert("Error al crear producto");
        }
    });

    // --- ELIMINAR PRODUCTO ---
    async function eliminarProducto(id) {
        if(confirm('¿Seguro que deseas eliminar este producto?')) {
            await fetch(`${API_URL}/${id}`, { 
                method: 'DELETE',
                headers: { 'x-access-token': token }
            });
            cargarProductos();
        }
    }

    // Inicializar
    cargarProductos();
</script>

</body>
</html>
